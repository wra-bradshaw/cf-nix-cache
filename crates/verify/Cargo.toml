[package]
name = "cf-nix-cache-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Built for wasm32-unknown-unknown and loaded by the Worker, so it stays free
# of the workspace-hack crate (which pulls in tokio) and of anything with I/O.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The C library, built for wasm32 with clang (see nix/rust.nix).
zstd-safe = { version = "8", default-features = false }

[dev-dependencies]
zstd.workspace = true
