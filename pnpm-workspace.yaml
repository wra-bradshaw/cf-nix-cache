packages:
  - packages/*
allowBuilds:
  esbuild: true
  workerd: true
# Matches pnpm's CI default so a local user-level override cannot produce a
# lockfile that CI rejects.
minimumReleaseAge: 1440
# miniflare pins these exactly; override to their patched releases. They are
# local dev and test tooling only, never bundled into the Worker.
overrides:
  sharp@0.35: 0.35.5
  undici@7: 7.30.1
minimumReleaseAgeExclude:
  - '@cloudflare/vite-plugin@1.51.2'
  - miniflare@5.20260804.0-alpha
  - wrangler@4.120.1

# The public deployment template is installed independently, exactly as
# Cloudflare Workers Builds installs it after cloning the template repository.
