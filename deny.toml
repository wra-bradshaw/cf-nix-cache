[advisories]
version = 2

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]

[licenses.private]
# Workspace crates are publish = false and need no license audit.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the private workspace crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
