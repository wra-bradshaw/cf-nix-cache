name: Validate deployment template

on:
  pull_request:
  push:
    branches: [main]

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The publish workflow opens the release PR once npm serves the package,
      # and auto-merge depends on this job, so it must never pass by skipping.
      - name: Install the standalone template
        run: pnpm install --frozen-lockfile
      # `check` type-checks, runs the unit tests (JSONC parser and config
      # validation), validates wrangler.jsonc against the installed release,
      # and dry-runs it with Wrangler. The dry-run compiles and validates
      # locally and needs no Cloudflare credentials, so forks without secrets
      # still pass this job.
      - name: Type-check, validate and dry-run the config
        run: pnpm run check
