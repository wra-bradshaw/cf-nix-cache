name: Release PR

on:
  push:
    branches: [main]

concurrency:
  group: changesets-release-pr

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install the pnpm workspace
        run: pnpm install --frozen-lockfile
      - name: Create or update the version PR
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          version-script: pnpm release:version
          pr-title: "Release: version packages"
          commit-message: "Release: version packages"
      - name: Merge the version PR when CI passes
        if: steps.changesets.outputs['pr-number'] != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs['pr-number'] }}
        run: gh pr merge "$PR_NUMBER" --auto --squash
