name: Release PR

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - "packages/cf-nix-cache-worker/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/release-pr.yml"
      - "scripts/pin-processor-image.sh"

concurrency:
  group: changesets-release-pr

permissions:
  # actions: write lets the job dispatch CI for the version PR branch.
  actions: write
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-24.04
    # Docker Hub credentials for publishing the processor image.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The version command bumps the package, then publishes the processor
      # image and pins its digest, so the version PR is the whole release.
      - name: Create or update the version PR
        id: changesets
        uses: changesets/action@v1
        env:
          PROCESSOR_REPOSITORY: ${{ vars.PROCESSOR_REPOSITORY || 'docker.io/willlol/cf-nix-cache' }}
        with:
          version: pnpm release:version
          title: "Release: version packages"
          commit: "Release: version packages"
      # Pushes made with GITHUB_TOKEN do not trigger pull_request workflows,
      # so run CI explicitly on the version PR branch.
      - name: Run CI on the version PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "changeset-release/$GITHUB_REF_NAME"
