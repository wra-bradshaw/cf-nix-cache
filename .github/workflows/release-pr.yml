name: Release PR

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - "packages/cf-nix-cache-worker/package.json"
      - "pnpm-lock.yaml"

concurrency:
  group: changesets-release-pr

permissions:
  # actions: write lets the job dispatch CI for the version PR branch.
  actions: write
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create or update the version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          title: "Release: version packages"
          commit: "Release: version packages"
      # Pushes made with GITHUB_TOKEN do not trigger pull_request workflows,
      # so run CI explicitly on the version PR branch.
      - name: Run CI on the version PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "changeset-release/$GITHUB_REF_NAME"
