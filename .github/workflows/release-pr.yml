name: Release PR

# Every push to main rebuilds the version PR from the new HEAD, so the pinned
# processor image always matches the code that merging the PR releases. With
# no pending changesets the job does nothing.
on:
  push:
    branches: [main]

concurrency:
  group: changesets-release-pr

permissions:
  # actions: write lets the job dispatch CI for the version PR branch.
  actions: write
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-24.04
    # Docker Hub credentials for publishing the processor image.
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The version command bumps the package, then publishes the processor
      # image and pins its digest, so the version PR is the whole release.
      - name: Create or update the version PR
        id: changesets
        uses: changesets/action@v2
        env:
          PROCESSOR_REPOSITORY: ${{ vars.PROCESSOR_REPOSITORY || 'docker.io/willlol/cf-nix-cache' }}
        with:
          version-script: pnpm release:version
          pr-title: "Release: version packages"
          commit-message: "Release: version packages"
      # Pushes made with GITHUB_TOKEN do not trigger pull_request workflows,
      # so run CI explicitly on the version PR branch.
      - name: Run CI on the version PR
        if: steps.changesets.outputs['pr-number'] != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.changesets.outputs['pr-number'] }}
        run: |
          gh workflow run ci.yml --ref "changeset-release/$GITHUB_REF_NAME"
          gh pr merge "$PR_NUMBER" --auto --squash
