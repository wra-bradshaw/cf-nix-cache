name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check Rust, Worker, and Terraform
        run: |
          nix develop --command cargo fmt --check
          nix develop --command cargo test --workspace
          nix develop --command cargo clippy --workspace --all-targets -- -D warnings
          nix develop --command pnpm --dir apps/worker install --frozen-lockfile=false
          nix develop --command pnpm --dir apps/worker check
          nix develop --command pnpm --dir apps/worker test
          nix develop --command pnpm --dir apps/worker build
          nix develop --command pnpm --dir apps/worker contracts:check
          nix develop --command pnpm --dir apps/worker boundaries:check
          nix develop --command terraform -chdir=infra fmt -check -recursive
          nix develop --command terraform -chdir=infra init -backend=false -input=false
          nix develop --command terraform -chdir=infra validate
          nix flake check
          nix build .#cli
          nix build .#processor
          nix build .#packages.x86_64-linux.processorImage

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
      - name: Unused dependency report
        run: |
          cargo install cargo-machete --locked
          cargo machete
