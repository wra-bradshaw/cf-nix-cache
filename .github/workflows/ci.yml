name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Pull requests opened with GITHUB_TOKEN (the Release PR) do not trigger
  # pull_request runs; the release workflow dispatches CI on its branch so the
  # PR head commit still gets checks.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check release metadata
        run: |
          nix develop --command pnpm install --frozen-lockfile
          nix develop --command pnpm release:check --allow-placeholder
      - name: Check Rust
        run: |
          nix develop --command cargo fmt --check
          nix develop --command cargo clippy --workspace --all-targets -- -D warnings
          nix develop --command cargo test --workspace
      - name: Check Worker and npm package
        run: |
          nix develop --command pnpm --dir apps/worker install --frozen-lockfile
          nix develop --command pnpm --dir apps/worker check
          nix develop --command pnpm --dir apps/worker test
          nix develop --command pnpm --dir apps/worker build
          nix develop --command pnpm --dir packages/cf-nix-cache-worker build
          nix develop --command npm pack ./packages/cf-nix-cache-worker --dry-run
      - name: Build Nix outputs
        run: |
          nix flake check
          nix build .#cli .#processor .#packages.x86_64-linux.processorImage
