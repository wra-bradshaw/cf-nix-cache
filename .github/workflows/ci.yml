name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: nix develop --command bash -euo pipefail {0}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cache-name: ${{ vars.CACHE_NAME }}
          endpoint: ${{ secrets.CF_NIX_CACHE_ENDPOINT }}
          public-key: ${{ secrets.CF_NIX_CACHE_PUBLIC_KEY }}
          pull-token: ${{ secrets.CF_NIX_CACHE_PULL_TOKEN }}
      - name: Install the pnpm workspace
        run: pnpm install --frozen-lockfile
      - name: Check release metadata and encoding drift
        run: |
          pnpm release:check --allow-placeholder
          node bench/verify-worker/upload-nar.mts --check-drift
      - name: Build Nix outputs
        shell: bash
        run: nix flake check && nix build .#cli
      - name: Check, test and build the Worker
        run: pnpm --dir packages/worker check:all
      - name: Check the deployment template
        run: scripts/check-template.sh
      - name: Push Nix outputs to the cache
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          CF_NIX_CACHE_ENDPOINT: ${{ secrets.CF_NIX_CACHE_ENDPOINT }}
          CF_NIX_CACHE_TOKEN: ${{ secrets.CF_NIX_CACHE_TOKEN }}
        run: |
          [ -f "${NIX_BUILT_PATHS_FILE:-}" ] || exit 0
          tmp="$(mktemp)"
          sort -u "$NIX_BUILT_PATHS_FILE" | while IFS= read -r p; do
            [ -e "$p" ] && printf '%s\n' "$p"
          done > "$tmp" || true
          [ -s "$tmp" ] || exit 0
          xargs -r ./result/bin/cf-nix-cache push "$CACHE_NAME" < "$tmp"
