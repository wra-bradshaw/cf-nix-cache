name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: nix develop --command bash -euo pipefail {0}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          cache: ${{ vars.CACHE_NAME || 'will' }}
          endpoint: ${{ secrets.CF_NIX_CACHE_ENDPOINT }}
          public-key: ${{ secrets.CF_NIX_CACHE_PUBLIC_KEY }}
          pull-token: ${{ secrets.CF_NIX_CACHE_PULL_TOKEN }}
          push-token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CF_NIX_CACHE_TOKEN || '' }}
      - name: Install the pnpm workspace
        run: pnpm install --frozen-lockfile
      - name: Check release metadata and encoding drift
        run: |
          pnpm release:check --allow-placeholder
          node bench/verify-worker/upload-nar.mts --check-drift
      - name: Build Nix outputs
        shell: bash
        run: nix flake check && nix build .#cli .#cli-release
      - name: Check, test and build the Worker
        run: pnpm --dir packages/worker check:all
      - name: Check the deployment template
        run: scripts/check-template.sh
      - uses: ./push
        if: always()
