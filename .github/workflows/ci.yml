name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Pull requests opened with GITHUB_TOKEN (the Release PR) do not trigger
  # pull_request runs; the release workflow dispatches CI on its branch so the
  # PR head commit still gets checks.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Install the pnpm workspace
        run: nix develop --command pnpm install --frozen-lockfile
      - name: Check release metadata
        run: |
          nix develop --command pnpm release:check --allow-placeholder
      - name: Check Rust
        run: |
          nix develop --command cargo fmt --check
          nix develop --command cargo clippy --workspace --all-targets -- -D warnings
          nix develop --command cargo test --workspace
      - name: Check Worker and npm package
        run: |
          nix develop --command pnpm --dir packages/worker check
          nix develop --command pnpm --dir packages/worker test
          nix develop --command pnpm --dir packages/worker build
          nix develop --command npm pack ./packages/worker --dry-run
      - name: Build Nix outputs
        run: |
          nix flake check
          nix build .#cli .#processor .#packages.x86_64-linux.processorImage
      # Runs the Worker in miniflare against the real processor container, so
      # Wrangler/miniflare updates that break local container proxying fail CI.
      - name: Run the end-to-end upload test
        run: |
          image_path="$(nix build .#packages.x86_64-linux.processorImage --no-link --print-out-paths)"
          docker load --input "$image_path"
          docker tag cf-nix-cache-processor:nix cf-nix-cache-processor:nix-local
          nix develop --command pnpm --dir packages/worker e2e
