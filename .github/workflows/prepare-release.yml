name: Prepare release artifacts

on:
  workflow_dispatch:
    inputs:
      dockerhub_repository:
        description: "Public Docker Hub image repository"
        required: true
        default: "docker.io/willlol/cf-nix-cache"
        type: string

concurrency:
  group: prepare-release-artifacts

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Publish processor and pin digest
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: docker/setup-buildx-action@v3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate release inputs
        id: release
        env:
          IMAGE_REPOSITORY: ${{ inputs.dockerhub_repository }}
        run: |
          case "$IMAGE_REPOSITORY" in
            docker.io/*/*) ;;
            *) echo "dockerhub_repository must be docker.io/<namespace>/<repository>" >&2; exit 1 ;;
          esac
          if [[ "$IMAGE_REPOSITORY" == *our-org* ]]; then
            echo "dockerhub_repository still contains the our-org placeholder" >&2
            exit 1
          fi
          version="$(node -p "require('./packages/cf-nix-cache-worker/package.json').version")"
          revision="${GITHUB_SHA:0:12}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_REPOSITORY:v$version-$revision" >> "$GITHUB_OUTPUT"

      - name: Ensure the npm version is not already published
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          pnpm release:check --allow-zero-digest
          package_name="$(node -p "require('./packages/cf-nix-cache-worker/package.json').name")"
          if npm view "$package_name@$VERSION" version >/dev/null 2>&1; then
            echo "$package_name@$VERSION is already published" >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish the processor image
        id: processor
        env:
          IMAGE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Reusing processor image previously published for this release commit."
          else
            image_path="$(nix build .#packages.x86_64-linux.processorImage --no-link --print-out-paths)"
            docker load --input "$image_path"
            docker tag cf-nix-cache-processor:nix "$IMAGE_TAG"
            docker push "$IMAGE_TAG"
          fi
          manifest="$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{json .Manifest}}')"
          digest="$(printf '%s' "$manifest" | jq -er '.digest')"
          case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "invalid registry digest: $digest" >&2; exit 1 ;; esac
          repository="${IMAGE_TAG%:*}"
          echo "image=$repository@$digest" >> "$GITHUB_OUTPUT"

      - name: Pin the immutable release artifacts
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PROCESSOR_IMAGE: ${{ steps.processor.outputs.image }}
        run: |
          pnpm release:prepare --version "$VERSION" --image "$PROCESSOR_IMAGE"
          pnpm release:check

      - name: Validate the npm package
        run: |
          pnpm --dir apps/worker install --frozen-lockfile
          pnpm --dir apps/worker build
          pnpm --dir packages/cf-nix-cache-worker build
          npm pack ./packages/cf-nix-cache-worker --dry-run

      - name: Open the digest-pinning pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PROCESSOR_IMAGE: ${{ steps.processor.outputs.image }}
        run: |
          branch="release-artifacts/v$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "branch $branch already exists; update or remove its existing PR before retrying" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add packages/cf-nix-cache-worker/release-manifest.json cf-nix-cache-template/package.json cf-nix-cache-template/wrangler.jsonc
          git commit -m "Release: pin processor for v$VERSION"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Release: pin processor for v$VERSION" \
            --body "Pins the public processor image for npm release v$VERSION to \`$PROCESSOR_IMAGE\`. Merging this PR makes the npm publish workflow eligible to publish the matching Worker package."
