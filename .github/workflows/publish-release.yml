name: Publish release

on:
  push:
    branches: [main]
    paths:
      - "packages/worker/package.json"
      - "packages/worker/release-manifest.json"
      - "cf-nix-cache-template/package.json"
      - "cf-nix-cache-template/wrangler.jsonc"
  workflow_dispatch:

concurrency:
  group: publish-release

permissions:
  contents: write
  id-token: write

env:
  CACHE_NAME: ${{ vars.CACHE_NAME || 'will' }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    outputs:
      ready: ${{ steps.release.outputs.ready }}
      package_name: ${{ steps.release.outputs.package_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Configure the Nix cache
        env:
          CF_NIX_CACHE_ENDPOINT: ${{ secrets.CF_NIX_CACHE_ENDPOINT }}
          CF_NIX_CACHE_PUBLIC_KEY: ${{ secrets.CF_NIX_CACHE_PUBLIC_KEY }}
          CF_NIX_CACHE_PULL_TOKEN: ${{ secrets.CF_NIX_CACHE_PULL_TOKEN }}
        run: |
          if [ -z "$CF_NIX_CACHE_ENDPOINT" ] || [ -z "$CF_NIX_CACHE_PUBLIC_KEY" ] || [ -z "$CF_NIX_CACHE_PULL_TOKEN" ]; then
            echo "::warning::cf-nix-cache secrets are unavailable; building without the cache"
            exit 0
          fi
          endpoint="${CF_NIX_CACHE_ENDPOINT%/}"
          host="${endpoint#*://}"
          host="${host%%/*}"
          sudo mkdir -p /etc/determinate
          netrc="$RUNNER_TEMP/cf-nix-cache-netrc"
          (umask 077; printf 'machine %s login token password %s\n' "$host" "$CF_NIX_CACHE_PULL_TOKEN" > "$netrc")
          jq -n --arg netrc "$netrc" '{authentication: {additionalNetrcSources: [$netrc]}}' \
            | sudo tee /etc/determinate/config.json >/dev/null
          printf 'extra-substituters = %s/cache/%s\nextra-trusted-public-keys = %s\n' \
            "$endpoint" "$CACHE_NAME" "$CF_NIX_CACHE_PUBLIC_KEY" \
            | sudo tee -a /etc/nix/nix.custom.conf >/dev/null
          sudo systemctl restart nix-daemon.service
          for _ in $(seq 1 30); do
            nix store info >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.15.0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install the pnpm workspace
        run: pnpm install --frozen-lockfile

      - name: Determine whether a pinned release is ready
        id: release
        run: |
          if ! node -e "process.exit(require('./packages/worker/release-manifest.json').releaseReady === true ? 0 : 1)"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release metadata has not been finalized yet; nothing to publish."
            exit 0
          fi
          pnpm release:check --github-output
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check npm publication state
        if: steps.release.outputs.ready == 'true'
        id: npm
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify an existing npm publication
        if: steps.release.outputs.ready == 'true' && steps.npm.outputs.published == 'true'
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          package_dir="$(mktemp -d)"
          tarball="$(npm pack "$PACKAGE_NAME@$VERSION" --pack-destination "$package_dir" --silent)"
          tar -xOf "$package_dir/$tarball" package/release-manifest.json | jq -S . > "$package_dir/published.json"
          jq -S . packages/worker/release-manifest.json > "$package_dir/expected.json"
          diff -u "$package_dir/expected.json" "$package_dir/published.json"

      - name: Build the npm artifact
        if: steps.release.outputs.ready == 'true' && steps.npm.outputs.published == 'false'
        run: |
          nix develop --command pnpm --dir packages/worker build
          nix develop --command npm pack ./packages/worker --dry-run --ignore-scripts

      - name: Publish npm package with trusted publishing
        if: steps.release.outputs.ready == 'true' && steps.npm.outputs.published == 'false'
        env:
          # Leave NPM_TOKEN unset after trusted publishing is configured. It is
          # supported only to bootstrap the package's first release.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install --global npm@11
          npm publish ./packages/worker --access public --ignore-scripts

      - name: Create the GitHub release
        if: steps.release.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --generate-notes --title "$tag"
          fi

  update-template:
    name: Update public deployment template
    needs: publish
    if: needs.publish.outputs.ready == 'true' && vars.TEMPLATE_REPOSITORY != ''
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Check out the release source
        uses: actions/checkout@v7
        with:
          path: source
      - name: Check out the public template
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.TEMPLATE_REPOSITORY }}
          token: ${{ secrets.TEMPLATE_REPO_TOKEN }}
          path: template
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.15.0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Refresh the standalone template and lockfile
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          TEMPLATE_REPOSITORY: ${{ vars.TEMPLATE_REPOSITORY }}
          TEMPLATE_REPO_TOKEN: ${{ secrets.TEMPLATE_REPO_TOKEN }}
        run: |
          rsync -a --delete --exclude .git source/cf-nix-cache-template/ template/
          for attempt in $(seq 30); do
            npm view "cf-nix-cache@$VERSION" version >/dev/null 2>&1 && break
            [ "$attempt" = 30 ] && { echo "cf-nix-cache@$VERSION never appeared on npm" >&2; exit 1; }
            sleep 20
          done
          pnpm --dir template install --lockfile-only
          cd template
          if [ -z "$(git status --porcelain)" ]; then
            echo "Template repository is already current."
            exit 0
          fi
          branch="release/v$VERSION"
          export GH_TOKEN="$TEMPLATE_REPO_TOKEN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add --all
          git commit -m "Update cf-nix-cache to v$VERSION"
          git push --force origin "$branch"
          open_pr="$(gh pr list \
            --repo "$TEMPLATE_REPOSITORY" \
            --head "$branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$open_pr" ]; then
            echo "Updated the existing template PR #$open_pr."
          else
            gh pr create \
              --repo "$TEMPLATE_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "Update cf-nix-cache to v$VERSION" \
              --body "Updates the deployment template and lockfile for cf-nix-cache v$VERSION."
          fi
          gh pr merge "$branch" --repo "$TEMPLATE_REPOSITORY" --auto --squash
