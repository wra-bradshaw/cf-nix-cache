name: Publish release

on:
  push:
    branches: [main]
    paths:
      - "packages/worker/package.json"
      - "packages/worker/release-manifest.json"
      - "cf-nix-cache-template/package.json"
      - "cf-nix-cache-template/wrangler.jsonc"
  workflow_dispatch:

concurrency:
  group: publish-release

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    outputs:
      ready: ${{ steps.release.outputs.ready }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cache-name: ${{ vars.CACHE_NAME }}
          endpoint: ${{ secrets.CF_NIX_CACHE_ENDPOINT }}
          public-key: ${{ secrets.CF_NIX_CACHE_PUBLIC_KEY }}
          pull-token: ${{ secrets.CF_NIX_CACHE_PULL_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Check release metadata
        id: release
        run: pnpm release:check --github-output

      - name: Check npm publication state
        id: npm
        if: steps.release.outputs.ready == 'true'
        env:
          PACKAGE: ${{ steps.release.outputs.package_name }}@${{ steps.release.outputs.version }}
        run: |
          if ! npm view "$PACKAGE" version >/dev/null 2>&1; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
          dir="$(mktemp -d)"
          tarball="$(npm pack "$PACKAGE" --pack-destination "$dir" --silent)"
          diff -u <(jq -S . packages/worker/release-manifest.json) \
            <(tar -xOf "$dir/$tarball" package/release-manifest.json | jq -S .)

      - name: Build and publish the npm package
        if: steps.npm.outputs.published == 'false'
        env:
          # Leave NPM_TOKEN unset after trusted publishing is configured. It is
          # supported only to bootstrap the package's first release.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          nix develop --command pnpm --dir packages/worker build
          npm install --global npm@11
          npm publish ./packages/worker --access public --ignore-scripts

      - name: Create the GitHub release
        if: steps.release.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.release.outputs.version }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --title "$TAG"

  update-template:
    name: Update public deployment template
    needs: publish
    if: needs.publish.outputs.ready == 'true' && vars.TEMPLATE_REPOSITORY != ''
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.TEMPLATE_REPOSITORY }}
          token: ${{ secrets.TEMPLATE_REPO_TOKEN }}
          path: template
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Refresh the template and open its release PR
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_REPO_TOKEN }}
          REPOSITORY: ${{ vars.TEMPLATE_REPOSITORY }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: source/scripts/update-template-repo.sh source template "$REPOSITORY" "$VERSION"
