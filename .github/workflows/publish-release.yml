name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-release-${{ github.sha }}

permissions:
  contents: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.gate.outputs.release }}
      version: ${{ steps.metadata.outputs.version }}
      package_name: ${{ steps.metadata.outputs.package_name }}
      tag: ${{ steps.gate.outputs.tag }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check release metadata
        id: metadata
        run: node scripts/check-release.mts --github-output
      - name: Decide whether to publish
        id: gate
        if: steps.metadata.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          tag="v$VERSION"
          sha="$GITHUB_SHA"
          previous=""
          release=false
          if [ "$EVENT" = workflow_dispatch ]; then
            release=true
            sha="$(git log -1 --format=%H -S"\"version\": \"$VERSION\"" -- packages/worker/package.json)"
            sha="${sha:-$GITHUB_SHA}"
          else
            previous="$(git show "$BEFORE:packages/worker/package.json" 2>/dev/null | jq -r .version || true)"
            if [ -n "$previous" ] && [ "$previous" != "$VERSION" ]; then
              release=true
            fi
          fi
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "$tag: release=$release (previous version: ${previous:-none})"

  publish:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          cache: ${{ vars.CACHE_NAME || 'will' }}
          endpoint: ${{ secrets.CF_NIX_CACHE_ENDPOINT }}
          public-key: ${{ secrets.CF_NIX_CACHE_PUBLIC_KEY }}
          pull-token: ${{ secrets.CF_NIX_CACHE_PULL_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Check npm publication state
        id: npm
        env:
          PACKAGE: ${{ needs.check.outputs.package_name }}@${{ needs.check.outputs.version }}
        run: |
          if ! npm view "$PACKAGE" version >/dev/null 2>&1; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
          dir="$(mktemp -d)"
          tarball="$(npm pack "$PACKAGE" --pack-destination "$dir" --silent)"
          diff -u <(jq -S . packages/worker/release-manifest.json) \
            <(tar -xOf "$dir/$tarball" package/release-manifest.json | jq -S .)

      - name: Build and publish the npm package
        if: steps.npm.outputs.published == 'false'
        env:
          # Leave NPM_TOKEN unset after trusted publishing is configured. It is
          # supported only to bootstrap the package's first release.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          nix develop --command pnpm --dir packages/worker build
          npm install --global npm@11
          npm publish ./packages/worker --access public --ignore-scripts

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --target "$SHA" --generate-notes --title "$TAG"

  binaries:
    name: Release binary (${{ matrix.system }})
    needs: [check, publish]
    if: needs.check.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { system: x86_64-linux, runner: ubuntu-24.04 }
          - { system: aarch64-linux, runner: ubuntu-24.04-arm }
          - { system: aarch64-darwin, runner: macos-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          cache: ${{ vars.CACHE_NAME || 'will' }}
          endpoint: ${{ secrets.CF_NIX_CACHE_ENDPOINT }}
          public-key: ${{ secrets.CF_NIX_CACHE_PUBLIC_KEY }}
          pull-token: ${{ secrets.CF_NIX_CACHE_PULL_TOKEN }}
      - name: Upload the CLI to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: cf-nix-cache-${{ matrix.system }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$ASSET"; then
            echo "$ASSET is already attached to $TAG; not overwriting it."
            exit 0
          fi
          nix build --print-build-logs .#cli-release
          cp result/bin/cf-nix-cache "$ASSET"
          gh release upload "$TAG" "$ASSET"

  update-template:
    name: Update public deployment template
    needs: [check, publish]
    if: needs.check.outputs.release == 'true' && vars.TEMPLATE_REPOSITORY != ''
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.TEMPLATE_REPOSITORY }}
          token: ${{ secrets.TEMPLATE_REPO_TOKEN }}
          path: template
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Refresh the template and open its release PR
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_REPO_TOKEN }}
          REPOSITORY: ${{ vars.TEMPLATE_REPOSITORY }}
          VERSION: ${{ needs.check.outputs.version }}
        run: source/scripts/update-template-repo.sh source template "$REPOSITORY" "$VERSION"
